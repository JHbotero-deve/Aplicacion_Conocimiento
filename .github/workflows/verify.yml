name: Verificación Ganadería Pro

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Instalar dependencias del Backend
      run: |
        cd backend
        npm install

    - name: Verificar sintaxis del código (Lint)
      run: |
        cd backend
        node --check server.js

    - name: Probar construcción de imagen Docker
      run: |
        docker build -t ganaderia-test ./backend

    - name: Auditoría de seguridad de dependencias
      run: |
        cd backend
        npm audit --audit-level=high || true
