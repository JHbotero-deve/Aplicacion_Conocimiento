<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Pecuario | Ganadería Pro</title>
    <link rel="stylesheet" href="../assets/css/tailwind.css">
    <link rel="stylesheet" href="../assets/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; background: #020617; }
        .glass-card { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        select option { background-color: #0f172a; color: white; }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12 flex flex-col items-center">

    <div class="w-full max-w-5xl space-y-10">
        <!-- Header Corporativo -->
        <div class="flex justify-between items-center bg-white/5 p-8 rounded-[2rem] border border-white/5 backdrop-blur-md">
            <div class="flex items-center gap-6">
                <div class="w-14 h-14 bg-emerald-500 rounded-2xl flex items-center justify-center text-[#020617]">
                    <i class="fa-solid fa-cow text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-white uppercase tracking-tighter">Registro Pecuario</h1>
                    <p class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em]">Censo Oficial ICA 3-101</p>
                </div>
            </div>
            <div class="flex gap-4">
                <button onclick="navigation.goBack()" class="hidden md:flex items-center gap-2 px-6 py-3 rounded-xl bg-white/5 text-slate-300 font-bold text-xs uppercase hover:bg-white/10 transition-all border border-white/5">
                    <i class="fa-solid fa-chart-pie-simple"></i> Dashboard
                </button>
                <button onclick="navigation.logout()" class="px-6 py-3 rounded-xl bg-rose-500/10 text-rose-500 font-bold text-xs uppercase hover:bg-rose-500/20 transition-all">Salir</button>
            </div>
        </div>

        <form id="ganado" class="glass-card rounded-[3rem] p-10 md:p-16 space-y-12">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-10">
                <!-- Inputs con Botón de Voz Minimalista -->
                <div class="space-y-3">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest ml-2">Número de Identificación (Chapeta)</label>
                    <div class="relative">
                        <input type="text" id="chapeta" name="chapeta" required placeholder="ID-0000"
                            class="w-full bg-white/5 border-2 border-white/5 rounded-2xl px-6 py-5 focus:outline-none focus:border-emerald-500/50 transition-all font-bold text-xl text-white">
                        <button type="button" onclick="activateVoice('chapeta')" class="absolute right-3 top-1/2 -translate-y-1/2 w-12 h-12 bg-emerald-500/10 text-emerald-500 rounded-xl hover:bg-emerald-500 hover:text-[#020617] transition-all flex items-center justify-center">
                            <i class="fa-solid fa-microphone"></i>
                        </button>
                    </div>
                </div>

                <div class="space-y-3">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest ml-2">Especie Animal</label>
                    <div class="relative">
                        <select id="especie" name="especie" required
                            class="w-full bg-white/5 border-2 border-white/5 rounded-2xl px-6 py-5 focus:outline-none focus:border-emerald-500/50 transition-all font-bold text-white appearance-none">
                            <option value="Bovino">Bovino (Res)</option>
                            <option value="Bufalino">Bufalino</option>
                            <option value="Equino">Equino</option>
                            <option value="Porcino">Porcino</option>
                        </select>
                        <button type="button" onclick="activateVoice('especie', 'especies')" class="absolute right-3 top-1/2 -translate-y-1/2 w-12 h-12 bg-white/5 text-slate-400 rounded-xl hover:text-white transition-all flex items-center justify-center">
                            <i class="fa-solid fa-microphone"></i>
                        </button>
                    </div>
                </div>

                <div class="space-y-3">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest ml-2">Clasificación Etaria</label>
                    <div class="relative">
                        <select id="categoria_etaria" name="categoria_etaria" required
                            class="w-full bg-white/5 border-2 border-white/5 rounded-2xl px-6 py-5 focus:outline-none focus:border-emerald-500/50 transition-all font-bold text-white appearance-none">
                            <option value="Cría (0-12m)">Cría (Nivel 1)</option>
                            <option value="Levante (1-2a)">Levante (Nivel 2)</option>
                            <option value="Adulto (>2a)">Adulto (Nivel 3)</option>
                        </select>
                        <button type="button" onclick="activateVoice('categoria_etaria', 'etaria')" class="absolute right-3 top-1/2 -translate-y-1/2 w-12 h-12 bg-white/5 text-slate-400 rounded-xl hover:text-white transition-all flex items-center justify-center">
                            <i class="fa-solid fa-microphone"></i>
                        </button>
                    </div>
                </div>

                <div class="space-y-3">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest ml-2">Raza Predominante</label>
                    <div class="relative">
                        <input type="text" id="raza" name="raza" required placeholder="EJ: BRAHMAN"
                            class="w-full bg-white/5 border-2 border-white/5 rounded-2xl px-6 py-5 focus:outline-none focus:border-emerald-500/50 transition-all font-bold text-white">
                        <button type="button" onclick="activateVoice('raza', 'razas')" class="absolute right-3 top-1/2 -translate-y-1/2 w-12 h-12 bg-white/5 text-slate-400 rounded-xl flex items-center justify-center">
                            <i class="fa-solid fa-microphone"></i>
                        </button>
                    </div>
                </div>

                <div class="space-y-3">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest ml-2">Masa Corporal (Kg)</label>
                    <div class="relative">
                        <input type="number" id="peso" step="0.01" name="peso" required
                            class="w-full bg-white/5 border-2 border-white/5 rounded-2xl px-6 py-5 focus:outline-none focus:border-emerald-500/50 transition-all font-black text-3xl text-emerald-400">
                        <button type="button" onclick="activateVoice('peso', 'peso')" class="absolute right-3 top-1/2 -translate-y-1/2 w-12 h-12 bg-emerald-500/10 text-emerald-500 rounded-xl flex items-center justify-center">
                            <i class="fa-solid fa-microphone"></i>
                        </button>
                    </div>
                </div>

                <div class="space-y-3">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest ml-2">Estado Sanitario (ICA)</label>
                    <input type="text" name="estadoica" required placeholder="VIGENTE"
                        class="w-full bg-white/5 border-2 border-white/5 rounded-2xl px-6 py-5 focus:outline-none focus:border-emerald-500/50 transition-all font-bold text-white uppercase">
                </div>
            </div>

            <button type="submit"
                class="w-full bg-emerald-600 text-[#020617] py-6 rounded-[2rem] hover:bg-emerald-500 transition-all shadow-2xl shadow-emerald-900/20 font-black text-lg uppercase tracking-[0.2em]">
                Formalizar Registro ICA
            </button>
        </form>

        <div id="footerContainer"></div>
    </div>

    <script src="../services/navigation.js"></script>
    <script src="../services/voiceAssistant.js"></script>
    <script>
        function activateVoice(fieldId, category = null) {
            const btn = event.currentTarget;
            const icon = btn.querySelector('i');
            const originalIcon = icon.className;
            icon.className = 'fa-solid fa-circle-notch fa-spin';

            voiceAssistant.start((corrected, original, anomaly) => {
                const input = document.getElementById(fieldId);
                if (input.tagName === 'SELECT') {
                    for (let i = 0; i < input.options.length; i++) {
                        if (input.options[i].text.toLowerCase().includes(corrected.toLowerCase()) ||
                            input.options[i].value.toLowerCase().includes(corrected.toLowerCase())) {
                            input.selectedIndex = i;
                            break;
                        }
                    }
                } else {
                    input.value = corrected;
                    // Efecto visual de "Inteligencia"
                    input.classList.add('ring-2', anomaly ? 'ring-amber-500' : 'ring-emerald-500');
                    setTimeout(() => input.classList.remove('ring-2', 'ring-amber-500', 'ring-emerald-500'), 2000);
                }

                if (anomaly) {
                    const status = document.createElement('p');
                    status.className = 'text-[10px] font-bold text-amber-500 mt-1 animate-pulse';
                    status.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${anomaly}`;
                    input.parentElement.appendChild(status);
                    setTimeout(() => status.remove(), 4000);
                }

                icon.className = originalIcon;
            }, (err) => {
                icon.className = originalIcon;
                let msg = "ERROR DE VOZ: ";
                if (err === 'not-allowed') msg += "Falta permiso de micrófono.";
                else if (err === 'network') msg += "Sin conexión para procesar voz.";
                else msg += "No se pudo entender el audio.";
                alert(msg);
            }, category);
        }

        const ganadoForm = document.getElementById('ganado');
        ganadoForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(ganadoForm);
            const data = Object.fromEntries(formData.entries());
            try {
                const response = await fetch("/ganado", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + localStorage.getItem("token") },
                    body: JSON.stringify(data)
                });
                if (response.ok) {
                    alert("SISTEMA: REGISTRO GUARDADO EXITOSAMENTE ✅");
                    ganadoForm.reset();
                } else {
                    const error = await response.json();
                    alert("ERROR: " + (error.error || "VERIFIQUE LOS DATOS TÉCNICOS"));
                }
            } catch (error) {
                alert("ERROR: SIN CONEXIÓN CON EL SERVIDOR");
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            navigation.renderFooter('footerContainer');
        });
    </script>
</body>
</html>
