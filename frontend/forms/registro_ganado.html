<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso de Ganado - Sistema Ganadero</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-12 font-sans flex flex-col items-center">

  <div class="w-full max-w-4xl space-y-8">
    <!-- Header Navegación -->
    <div class="flex justify-between items-center bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center">
                <i class="fa-solid fa-cow text-2xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-black text-slate-800">Registrar Animal</h1>
                <p class="text-xs text-slate-400 font-bold uppercase tracking-widest">Entrada de Inventario</p>
            </div>
        </div>
        <div class="flex gap-4">
            <a href="admin_dashboard.html" class="hidden md:flex items-center text-slate-400 hover:text-emerald-600 transition font-bold text-sm">
                <i class="fa-solid fa-chart-line mr-2"></i> Dashboard
            </a>
            <button onclick="logout()" class="bg-slate-100 text-slate-600 px-4 py-2 rounded-xl font-bold text-sm hover:bg-red-50 hover:text-red-600 transition">
                Cerrar Sesión
            </button>
        </div>
    </div>

    <form id="ganado" class="bg-white rounded-3xl shadow-2xl p-10 space-y-8 border border-slate-100">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Chapeta con Voz -->
            <div class="space-y-2">
                <label class="block text-xs font-black text-slate-400 uppercase tracking-widest">Número de Chapeta</label>
                <div class="relative">
                    <input type="text" id="chapeta" name="chapeta" required placeholder="Ej: 1024"
                        class="w-full border-2 border-slate-100 rounded-2xl px-6 py-4 focus:outline-none focus:border-emerald-500 transition-all font-bold text-lg">
                    <button type="button" onclick="activateVoice('chapeta')" class="absolute right-2 top-1/2 -translate-y-1/2 w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl hover:bg-emerald-200 transition flex items-center justify-center">
                        <i class="fa-solid fa-microphone text-xl"></i>
                    </button>
                </div>
            </div>

            <!-- Especie (Select + Voz) -->
            <div class="space-y-2">
                <label class="block text-xs font-black text-slate-400 uppercase tracking-widest">Especie (ICA)</label>
                <div class="relative">
                    <select id="especie" name="especie" required
                        class="w-full border-2 border-slate-100 rounded-2xl px-6 py-4 focus:outline-none focus:border-emerald-500 transition-all font-bold appearance-none bg-white">
                        <option value="Bovino">Bovino (Vaca/Toro)</option>
                        <option value="Bufalino">Bufalino</option>
                        <option value="Equino">Equino (Caballo)</option>
                        <option value="Porcino">Porcino (Cerdo)</option>
                        <option value="Ovino">Ovino (Oveja)</option>
                        <option value="Caprino">Caprino (Cabra)</option>
                    </select>
                    <button type="button" onclick="activateVoice('especie')" class="absolute right-2 top-1/2 -translate-y-1/2 w-12 h-12 bg-blue-100 text-blue-600 rounded-xl hover:bg-blue-200 transition flex items-center justify-center">
                        <i class="fa-solid fa-microphone text-xl"></i>
                    </button>
                </div>
            </div>

            <!-- Sexo -->
            <div class="space-y-2">
                <label class="block text-xs font-black text-slate-400 uppercase tracking-widest">Sexo</label>
                <div class="relative">
                    <select id="sexo" name="sexo" required
                        class="w-full border-2 border-slate-100 rounded-2xl px-6 py-4 focus:outline-none focus:border-emerald-500 transition-all font-bold appearance-none bg-white">
                        <option value="Hembra">Hembra</option>
                        <option value="Macho">Macho</option>
                    </select>
                    <button type="button" onclick="activateVoice('sexo')" class="absolute right-2 top-1/2 -translate-y-1/2 w-12 h-12 bg-purple-100 text-purple-600 rounded-xl hover:bg-purple-200 transition flex items-center justify-center">
                        <i class="fa-solid fa-microphone text-xl"></i>
                    </button>
                </div>
            </div>

            <!-- Categoría Etaria (ICA) -->
            <div class="space-y-2">
                <label class="block text-xs font-black text-slate-400 uppercase tracking-widest">Etapa de Vida</label>
                <div class="relative">
                    <select id="categoria_etaria" name="categoria_etaria" required
                        class="w-full border-2 border-slate-100 rounded-2xl px-6 py-4 focus:outline-none focus:border-emerald-500 transition-all font-bold appearance-none bg-white">
                        <option value="Cría (0-12m)">Cría (0-12 meses)</option>
                        <option value="Levante (1-2a)">Levante (1-2 años)</option>
                        <option value="Adulto (>2a)">Adulto (Más de 2 años)</option>
                    </select>
                    <button type="button" onclick="activateVoice('categoria_etaria')" class="absolute right-2 top-1/2 -translate-y-1/2 w-12 h-12 bg-amber-100 text-amber-600 rounded-xl hover:bg-amber-200 transition flex items-center justify-center">
                        <i class="fa-solid fa-microphone text-xl"></i>
                    </button>
                </div>
            </div>

            <div class="space-y-2">
                <label class="block text-xs font-black text-slate-400 uppercase tracking-widest">Raza / Tipo</label>
                <div class="relative">
                    <input type="text" id="raza" name="raza" required placeholder="Ej: Brahman"
                        class="w-full border-2 border-slate-100 rounded-2xl px-6 py-4 focus:outline-none focus:border-emerald-500 transition-all font-medium">
                    <button type="button" onclick="activateVoice('raza')" class="absolute right-2 top-1/2 -translate-y-1/2 w-12 h-12 bg-slate-100 text-slate-600 rounded-xl flex items-center justify-center">
                        <i class="fa-solid fa-microphone text-xl"></i>
                    </button>
                </div>
            </div>

            <div class="space-y-2">
                <label class="block text-xs font-black text-slate-400 uppercase tracking-widest">Peso Actual (kg)</label>
                <div class="relative">
                    <input type="number" id="peso" step="0.01" name="peso" required
                        class="w-full border-2 border-slate-100 rounded-2xl px-6 py-4 focus:outline-none focus:border-emerald-500 transition-all font-bold text-xl">
                    <button type="button" onclick="activateVoice('peso')" class="absolute right-2 top-1/2 -translate-y-1/2 w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center">
                        <i class="fa-solid fa-microphone text-xl"></i>
                    </button>
                </div>
            </div>

            <div class="space-y-2">
                <label class="block text-xs font-black text-slate-400 uppercase tracking-widest">Nro RUV (Vacunación)</label>
                <input type="text" name="ruv_numero" placeholder="Ej: 998877"
                    class="w-full border-2 border-slate-100 rounded-2xl px-6 py-4 focus:outline-none focus:border-emerald-500 transition-all font-medium">
            </div>

            <div class="space-y-2">
                <label class="block text-xs font-black text-slate-400 uppercase tracking-widest">Marca o Hierro</label>
                <input type="text" name="hierro_descripcion" placeholder="Describa la marca"
                    class="w-full border-2 border-slate-100 rounded-2xl px-6 py-4 focus:outline-none focus:border-emerald-500 transition-all font-medium">
            </div>
        </div>

        <button type="submit"
            class="w-full bg-emerald-600 text-white py-5 rounded-2xl hover:bg-emerald-700 transition-all shadow-lg hover:shadow-emerald-200 font-black text-xl uppercase tracking-widest">
            <i class="fa-solid fa-floppy-disk mr-2"></i> Guardar Registro ICA
        </button>
    </form>
  </div>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <script src="../services/voiceAssistant.js"></script>
  <script>
    function logout() {
      localStorage.removeItem("token");
      window.location.href = "login.html";
    }

    function activateVoice(fieldId) {
        const btn = event.currentTarget;
        const icon = btn.querySelector('i');

        // Feedback visual de escucha
        icon.classList.remove('fa-microphone');
        icon.classList.add('fa-spinner', 'fa-spin');
        btn.classList.add('bg-red-100', 'text-red-600');

        voiceAssistant.start((corrected, original) => {
            const input = document.getElementById(fieldId);
            if (input.tagName === 'SELECT') {
                // Buscar opción que coincida con el término corregido
                for (let i = 0; i < input.options.length; i++) {
                    if (input.options[i].text.toLowerCase().includes(corrected.toLowerCase()) ||
                        input.options[i].value.toLowerCase().includes(corrected.toLowerCase())) {
                        input.selectedIndex = i;
                        break;
                    }
                }
            } else {
                input.value = corrected;
            }

            // Volver estado normal
            icon.classList.remove('fa-spinner', 'fa-spin');
            icon.classList.add('fa-microphone');
            btn.classList.remove('bg-red-100', 'text-red-600');

            // Animación de éxito
            input.classList.add('border-emerald-500', 'bg-emerald-50');
            setTimeout(() => input.classList.remove('bg-emerald-50'), 1000);

        }, (err) => {
            icon.classList.remove('fa-spinner', 'fa-spin');
            icon.classList.add('fa-microphone');
            btn.classList.remove('bg-red-100', 'text-red-600');
            alert("No se pudo escuchar bien. Intenta de nuevo.");
        });
    }

    const ganadoForm = document.getElementById('ganado');
    ganadoForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(ganadoForm);
      const data = Object.fromEntries(formData.entries());

      try {
        const response = await fetch("/ganado", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + localStorage.getItem("token")
          },
          body: JSON.stringify(data)
        });
        if (response.ok) {
          alert("Registro ICA guardado exitosamente ✅");
          ganadoForm.reset();
        } else {
          const error = await response.json();
          alert("Error: " + (error.error || "Datos incompletos"));
        }
      } catch (error) {
        alert("Sin conexión al servidor");
      }
    });
  </script>

  <script>
    const ganadoForm = document.getElementById('ganado');
    ganadoForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        chapeta: ganadoForm.chapeta.value,
        raza: ganadoForm.raza.value,
        edad: ganadoForm.edad.value,
        peso: ganadoForm.peso.value,
        fecha_ingreso: ganadoForm.fecha_ingreso.value,
        estadoica: ganadoForm.estadoica.value
      };
      try {
        const response = await fetch("/ganado", {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            "Authorization": "Bearer " + localStorage.getItem("token")
          },
          body: JSON.stringify(data)
        });
        if (response.ok) {
          alert("Ganado registrado ✅");
          ganadoForm.reset();
        } else {
          const error = await response.json();
          alert("Error en el registro: " + (error.error || "desconocido"));
        }
      } catch (error) {
        alert("Error en la conexión con el servidor");
      }
    });
  </script>
</body>
</html>
