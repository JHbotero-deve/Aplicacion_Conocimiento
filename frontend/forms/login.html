<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Corporativo | Ganadería Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 relative overflow-hidden">

    <!-- Background Elements -->
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-emerald-500/10 rounded-full blur-[120px]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-blue-500/10 rounded-full blur-[120px]"></div>

    <div class="w-full max-w-md relative z-10">
        <div class="text-center mb-10">
            <div class="inline-flex w-16 h-16 bg-emerald-500 rounded-2xl items-center justify-center text-[#020617] shadow-2xl shadow-emerald-500/20 mb-6">
                <i class="fa-solid fa-shield-keyhole text-3xl"></i>
            </div>
            <h1 class="text-4xl font-black text-white tracking-tighter uppercase">Identificación</h1>
            <p class="text-slate-500 font-medium mt-2">Acceso seguro a la plataforma Ganadería Pro</p>
        </div>

        <form id="loginForm" class="glass rounded-[2.5rem] p-10 space-y-8 shadow-2xl">
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] mb-3 ml-2">Usuario del Sistema</label>
                    <div class="relative">
                        <i class="fa-solid fa-user-vneck absolute left-5 top-1/2 -translate-y-1/2 text-slate-600"></i>
                        <input type="text" name="nombre_usuario" required
                            class="w-full bg-white/5 border border-white/5 rounded-2xl pl-14 pr-6 py-5 focus:outline-none focus:border-emerald-500/50 transition-all font-bold text-white placeholder:text-slate-700" placeholder="Nombre de operador">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] mb-3 ml-2">Contraseña de Seguridad</label>
                    <div class="relative">
                        <i class="fa-solid fa-key-skeleton absolute left-5 top-1/2 -translate-y-1/2 text-slate-600"></i>
                        <input type="password" name="contrasena" required
                            class="w-full bg-white/5 border border-white/5 rounded-2xl pl-14 pr-6 py-5 focus:outline-none focus:border-emerald-500/50 transition-all font-bold text-white placeholder:text-slate-700" placeholder="••••••••">
                    </div>
                </div>
            </div>

            <button type="submit"
                class="w-full bg-emerald-600 text-white py-5 rounded-2xl hover:bg-emerald-500 transition-all shadow-xl shadow-emerald-900/20 font-black text-sm uppercase tracking-widest">
                Autenticar Operador
            </button>

            <div class="flex flex-col gap-4 text-center">
                <a href="recuperar_cuenta.html" class="text-xs font-bold text-slate-500 hover:text-emerald-500 transition-colors uppercase tracking-widest">Recuperar Acceso Offline</a>
                <div class="h-px bg-white/5 w-1/2 mx-auto"></div>
                <p class="text-xs font-bold text-slate-600">© 2026 GANADERÍA PRO | VERSIÓN 4.0</p>
            </div>
        </form>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');

        loginForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const data = {
            nombre_usuario: loginForm.nombre_usuario.value,
            contrasena: loginForm.contrasena.value
          };
          try {
            const response = await fetch("/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(data)
            });

            if (response.ok) {
              const result = await response.json();
              localStorage.setItem("token", result.token);
              localStorage.setItem("rol", result.rol_usuario); // Guardar rol para navegación contextual

              const userRole = result.rol_usuario;
              if (userRole === "admin") {
                window.location.href = "admin_dashboard.html";
              } else if (userRole === "mayordomo") {
                window.location.href = "mayordomo_dashboard.html";
              } else if (userRole === "veterinario") {
                window.location.href = "veterinario_dashboard.html";
              } else {
                window.location.href = "ganadero_dashboard.html";
              }
            } else {
              const error = await response.json();
              alert("SISTEMA: " + (error.error || "ERROR DE AUTENTICACIÓN"));
            }
          } catch (error) {
            alert("ERROR: SIN CONEXIÓN CON EL NODO CENTRAL");
          }
        });
    </script>
</body>
</html>
