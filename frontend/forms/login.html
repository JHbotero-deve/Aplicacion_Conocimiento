<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistema Ganadero</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="w-full max-w-md">
    <!-- Botón Volver -->
    <a href="../index.html" class="inline-flex items-center text-slate-400 hover:text-emerald-600 mb-6 transition font-bold text-sm">
        <i class="fa-solid fa-arrow-left mr-2"></i> Volver al Inicio
    </a>

    <form id="loginForm" class="bg-white rounded-3xl shadow-2xl p-10 space-y-8 border border-slate-100">
        <div class="text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-100 text-emerald-600 rounded-2xl mb-4">
                <i class="fa-solid fa-lock text-3xl"></i>
            </div>
            <h2 class="text-4xl font-black text-slate-800 tracking-tight">Iniciar Sesión</h2>
            <p class="text-slate-400 mt-2 font-medium">Accede al panel de control ganadero</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Usuario</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"></i>
                    <input type="text" name="nombre_usuario" required
                        class="w-full border-2 border-slate-100 rounded-2xl pl-12 pr-4 py-4 focus:outline-none focus:border-emerald-500 transition-all font-medium text-slate-700">
                </div>
            </div>

            <div>
                <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Contraseña</label>
                <div class="relative">
                    <i class="fa-solid fa-key absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"></i>
                    <input type="password" name="contrasena" required
                        class="w-full border-2 border-slate-100 rounded-2xl pl-12 pr-4 py-4 focus:outline-none focus:border-emerald-500 transition-all font-medium text-slate-700">
                </div>
            </div>
        </div>

        <button type="submit"
            class="w-full bg-emerald-600 text-white py-4 rounded-2xl hover:bg-emerald-700 transition-all shadow-lg hover:shadow-emerald-200 font-black text-lg uppercase tracking-widest">
            Entrar al Sistema
        </button>

        <p class="text-center text-sm text-slate-400 font-medium">
            ¿No tienes cuenta? <a href="registro.html" class="text-emerald-600 font-bold hover:underline">Regístrate aquí</a>
        </p>
    </form>
  </div>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

  <script>
    const loginForm = document.getElementById('loginForm');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        nombre_usuario: loginForm.nombre_usuario.value,
        contrasena: loginForm.contrasena.value
      };
      try {
        const response = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        if (response.ok) {
          const result = await response.json();
          localStorage.setItem("token", result.token);
          alert("Inicio de sesión exitoso ✅");

          const userRole = result.rol_usuario;
          if (userRole === "admin") {
            window.location.href = "admin_dashboard.html";
          } else {
            window.location.href = "registro_ganado.html";
          }
        } else {
          const error = await response.json();
          alert("❌ " + (error.error || "Error al iniciar sesión"));
        }
      } catch (error) {
        alert("Error en la conexión con el servidor");
      }
    });
  </script>
</body>
</html>
