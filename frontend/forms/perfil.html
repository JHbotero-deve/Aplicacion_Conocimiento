<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguridad de Cuenta | Ganadería Pro</title>
    <link rel="stylesheet" href="../assets/css/tailwind.css">
    <link rel="stylesheet" href="../assets/css/all.min.css">
    <link rel="stylesheet" href="../styles/theme.css">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6 mesh-gradient-light">

    <div class="w-full max-w-lg space-y-8">
        <button onclick="navigation.goBack()" class="inline-flex items-center text-slate-400 hover:text-emerald-600 transition-all font-black text-[10px] uppercase tracking-widest">
            <i class="fa-solid fa-arrow-left mr-2"></i> Retornar al Panel
        </button>

        <div class="premium-panel p-10 md:p-12 space-y-10">
            <div class="text-center">
                <div class="inline-flex items-center justify-center w-20 h-20 bg-emerald-50 text-emerald-600 rounded-[2rem] mb-6 border border-emerald-100 shadow-xl shadow-emerald-900/5">
                    <i class="fa-solid fa-user-shield text-3xl"></i>
                </div>
                <h2 class="text-3xl font-black text-slate-900 tracking-tight uppercase">Privacidad</h2>
                <p class="text-slate-400 mt-2 font-bold text-xs uppercase tracking-widest">Actualización de Clave Maestra</p>
            </div>

            <form id="formPerfil" class="space-y-6">
                <div class="space-y-2">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Nueva Contraseña</label>
                    <input type="password" id="nuevaClave" required placeholder="••••••••" class="premium-input font-black tracking-widest">
                </div>
                <div class="space-y-2">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Confirmación</label>
                    <input type="password" id="confirmClave" required placeholder="••••••••" class="premium-input font-black tracking-widest">
                </div>

                <button type="submit" class="btn-premium w-full mt-6 py-6 text-sm uppercase tracking-[0.2em]">
                    Sincronizar Nueva Clave
                </button>
            </form>
        </div>

        <div id="footerContainer"></div>
    </div>

    <script src="../services/navigation.js"></script>
    <script>
        const token = localStorage.getItem("token");
        document.getElementById('formPerfil').addEventListener('submit', async (e) => {
            e.preventDefault();
            const clave = document.getElementById('nuevaClave').value;
            const confirm = document.getElementById('confirmClave').value;
            if (clave !== confirm) { alert("Las claves no coinciden ❌"); return; }

            try {
                const res = await fetch("/admin/usuarios/password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
                    body: JSON.stringify({ id: null, nuevaContrasena: clave })
                });
                if (res.ok) { alert("CLAVE ACTUALIZADA ✅"); navigation.goBack(); }
                else { alert("ERROR DE SERVIDOR ❌"); }
            } catch (e) { alert("SIN CONEXIÓN"); }
        });

        document.addEventListener('DOMContentLoaded', () => {
            navigation.renderFooter('footerContainer');
        });
    </script>
</body>
</html>
