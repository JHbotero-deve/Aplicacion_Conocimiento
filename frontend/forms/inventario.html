<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balance de Insumos | Ganadería Pro</title>
    <link rel="stylesheet" href="../assets/css/tailwind.css">
    <link rel="stylesheet" href="../assets/css/all.min.css">
    <link rel="stylesheet" href="../styles/theme.css">
</head>
<body class="min-h-screen p-6 md:p-12 flex flex-col items-center mesh-gradient-light">

    <div class="w-full max-w-4xl space-y-10">
        <div class="premium-card p-8 flex justify-between items-center border-amber-100">
            <div class="flex items-center gap-6">
                <div class="w-14 h-14 bg-amber-500 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-amber-200">
                    <i class="fa-solid fa-boxes-stacked text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-slate-900 uppercase tracking-tighter">Control de Almacén</h1>
                    <p class="text-[10px] font-black text-amber-600 uppercase tracking-widest">Insumos y Suministros</p>
                </div>
            </div>
            <button onclick="navigation.goBack()" class="px-6 py-3 rounded-xl bg-slate-50 text-slate-600 font-bold text-xs uppercase hover:bg-slate-100 border border-slate-100">Cerrar</button>
        </div>

        <form id="formInventario" class="premium-panel p-10 md:p-16 space-y-12">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-10">

                <div class="space-y-3">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Nombre del Insumo</label>
                    <div class="relative">
                        <input type="text" id="inv_nombre" name="nombre" required placeholder="Descripción Comercial"
                            class="premium-input font-bold uppercase">
                        <button type="button" onclick="activateVoice('inv_nombre')" class="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 bg-slate-50 text-amber-500 rounded-xl flex items-center justify-center"><i class="fa-solid fa-microphone"></i></button>
                    </div>
                </div>

                <div class="space-y-3">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Tipo de Producto</label>
                    <select name="tipo" class="premium-input appearance-none font-bold text-sm">
                        <option value="Alimento">NUTRICIÓN / SUPLEMENTO</option>
                        <option value="Medicamento">FARMACOLOGÍA / VACUNA</option>
                        <option value="Herramienta">EQUIPO TÉCNICO</option>
                    </select>
                </div>

                <div class="space-y-3">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Cantidad de Ingreso</label>
                    <div class="flex gap-4">
                        <input type="number" step="0.1" name="cantidad" required class="flex-1 premium-input text-2xl font-black text-amber-600">
                        <select name="unidad" class="w-32 premium-input text-[10px] font-black uppercase">
                            <option value="Kilos">Kg</option>
                            <option value="Bultos">Bultos</option>
                            <option value="ML">ml</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-3">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Vencimiento</label>
                    <input type="date" name="fecha_vencimiento" class="premium-input font-bold text-slate-400">
                </div>
            </div>

            <button type="submit" class="btn-premium w-full py-6 text-lg bg-gradient-to-r from-amber-600 to-amber-400 shadow-amber-200">
                <i class="fa-solid fa-file-invoice"></i> Registrar Entrada
            </button>
        </form>

        <div id="footerContainer"></div>
    </div>

    <script src="../services/navigation.js"></script>
    <script src="../services/voiceAssistant.js"></script>
    <script>
        function activateVoice(id) {
            voiceAssistant.start((corrected) => {
                document.getElementById(id).value = corrected;
                voiceAssistant.speak(`Entendido: ${corrected}`);
            });
        }
        document.addEventListener('DOMContentLoaded', () => {
            navigation.renderFooter('footerContainer');
        });
    </script>
</body>
</html>
