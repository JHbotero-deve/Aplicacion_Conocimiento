<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocolo Sanitario | Ganadería Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12 flex flex-col items-center">

    <div class="w-full max-w-4xl space-y-10">
        <div class="flex justify-between items-center bg-white/5 p-8 rounded-[2rem] border border-white/5">
            <div class="flex items-center gap-6">
                <div class="w-14 h-14 bg-rose-500 rounded-2xl flex items-center justify-center text-[#020617]">
                    <i class="fa-solid fa-kit-medical text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-white uppercase tracking-tighter">Intervención Sanitaria</h1>
                    <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Control Veterinario BPG</p>
                </div>
            </div>
            <a href="ganadero_dashboard.html" class="px-6 py-3 rounded-xl bg-white/5 text-slate-300 font-bold text-xs uppercase hover:bg-white/10 transition-all border border-white/5">Retornar</a>
        </div>

        <form id="formTratamiento" class="glass rounded-[3rem] p-10 md:p-16 space-y-12">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-10">

                <div class="space-y-3">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest ml-2">Identificador Animal</label>
                    <div class="relative">
                        <input type="text" id="animal_id" name="ganado_id" required placeholder="ID-0000"
                            class="w-full bg-white/5 border-2 border-white/5 rounded-2xl px-6 py-5 focus:outline-none focus:border-rose-500/50 transition-all font-bold text-xl text-white">
                        <button type="button" onclick="activateVoice('animal_id')" class="absolute right-3 top-1/2 -translate-y-1/2 w-12 h-12 bg-rose-500/10 text-rose-500 rounded-xl flex items-center justify-center"><i class="fa-solid fa-microphone"></i></button>
                    </div>
                </div>

                <div class="space-y-3">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest ml-2">Agente Farmacológico</label>
                    <div class="relative">
                        <input type="text" id="producto" name="producto" required placeholder="NOMBRE DEL PRODUCTO"
                            class="w-full bg-white/5 border-2 border-white/5 rounded-2xl px-6 py-5 focus:outline-none focus:border-rose-500/50 transition-all font-bold text-white uppercase">
                        <button type="button" onclick="activateVoice('producto')" class="absolute right-3 top-1/2 -translate-y-1/2 w-12 h-12 bg-white/5 text-slate-400 rounded-xl flex items-center justify-center"><i class="fa-solid fa-microphone"></i></button>
                    </div>
                </div>

                <div class="space-y-3 col-span-full">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest ml-2">Diagnóstico Clínico</label>
                    <div class="relative">
                        <input type="text" id="diagnostico" name="diagnostico" required placeholder="DESCRIPCIÓN DE LA SINTOMATOLOGÍA"
                            class="w-full bg-white/5 border-2 border-white/5 rounded-2xl px-6 py-5 focus:outline-none focus:border-rose-500/50 transition-all font-medium text-white">
                        <button type="button" onclick="activateVoice('diagnostico')" class="absolute right-3 top-1/2 -translate-y-1/2 w-12 h-12 bg-white/5 text-slate-400 rounded-xl flex items-center justify-center"><i class="fa-solid fa-microphone"></i></button>
                    </div>
                </div>

                <div class="space-y-3">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest ml-2">Tiempo de Retiro (Días)</label>
                    <div class="relative">
                        <input type="number" id="tiempo_retiro" name="tiempo_retiro" required value="0"
                            class="w-full bg-white/5 border-2 border-white/5 rounded-2xl px-6 py-5 focus:outline-none focus:border-amber-500/50 transition-all font-black text-3xl text-amber-500">
                        <button type="button" onclick="activateVoice('tiempo_retiro')" class="absolute right-3 top-1/2 -translate-y-1/2 w-12 h-12 bg-amber-500/10 text-amber-500 rounded-xl flex items-center justify-center"><i class="fa-solid fa-microphone"></i></button>
                    </div>
                </div>

                <div class="space-y-3">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest ml-2">Vía de Aplicación</label>
                    <div class="relative">
                        <select id="via" name="via" required class="w-full bg-white/5 border-2 border-white/5 rounded-2xl px-6 py-5 focus:outline-none focus:border-rose-500/50 transition-all font-bold text-white appearance-none">
                            <option value="Intramuscular">INTRAMUSCULAR</option>
                            <option value="Subcutánea">SUBCUTÁNEA</option>
                            <option value="Oral">ORAL</option>
                            <option value="Intravenosa">INTRAVENOSA</option>
                        </select>
                        <button type="button" onclick="activateVoice('via')" class="absolute right-3 top-1/2 -translate-y-1/2 w-12 h-12 bg-white/5 text-slate-400 rounded-xl flex items-center justify-center"><i class="fa-solid fa-microphone"></i></button>
                    </div>
                </div>
            </div>

            <button type="submit" class="w-full bg-rose-600 text-white py-6 rounded-[2rem] font-black text-lg uppercase tracking-widest hover:bg-rose-500 transition-all shadow-2xl shadow-rose-900/20">
                Confirmar Registro Médico
            </button>
        </form>
    </div>

    <script src="../services/voiceAssistant.js"></script>
    <script>
        function activateVoice(id) {
            voiceAssistant.start((corrected) => document.getElementById(id).value = corrected);
        }
        document.getElementById('formTratamiento').addEventListener('submit', async (e) => {
            e.preventDefault();
            alert("SISTEMA: TRATAMIENTO REGISTRADO CORRECTAMENTE ✅");
        });
    </script>
</body>
</html>
