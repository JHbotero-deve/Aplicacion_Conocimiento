<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Sistema Ganadero</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="w-full max-w-md">
    <!-- Botón Volver -->
    <a href="../index.html" class="inline-flex items-center text-slate-400 hover:text-emerald-600 mb-6 transition font-bold text-sm">
        <i class="fa-solid fa-arrow-left mr-2"></i> Volver al Inicio
    </a>

    <form id="register" class="bg-white rounded-3xl shadow-2xl p-10 space-y-8 border border-slate-100">
        <div class="text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl mb-4">
                <i class="fa-solid fa-user-plus text-3xl"></i>
            </div>
            <h2 class="text-4xl font-black text-slate-800 tracking-tight">Crear Cuenta</h2>
            <p class="text-slate-400 mt-2 font-medium">Únete a la gestión ganadera profesional</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Usuario</label>
                <input type="text" name="nombre_usuario" required placeholder="Nombre de usuario"
                    class="w-full border-2 border-slate-100 rounded-2xl px-6 py-4 focus:outline-none focus:border-blue-500 transition-all font-medium text-slate-700">
            </div>

            <div>
                <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Contraseña</label>
                <input type="password" name="contrasena" required placeholder="••••••••"
                    class="w-full border-2 border-slate-100 rounded-2xl px-6 py-4 focus:outline-none focus:border-blue-500 transition-all font-medium text-slate-700">
            </div>

            <div>
                <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Rol Asignado</label>
                <select name="rol_usuario" required
                    class="w-full border-2 border-slate-100 rounded-2xl px-6 py-4 focus:outline-none focus:border-blue-500 transition-all font-medium text-slate-700 bg-white">
                    <option value="" disabled selected>Seleccione un rol</option>
                    <option value="admin">Administrador (Control Total)</option>
                    <option value="usuario">Ganadero (Registros)</option>
                    <option value="veterinario">Veterinario (Salud)</option>
                </select>
            </div>
        </div>

        <button type="submit"
            class="w-full bg-blue-600 text-white py-4 rounded-2xl hover:bg-blue-700 transition-all shadow-lg hover:shadow-blue-200 font-black text-lg uppercase tracking-widest">
            Registrar Ahora
        </button>

        <p class="text-center text-sm text-slate-400 font-medium">
            ¿Ya tienes cuenta? <a href="login.html" class="text-blue-600 font-bold hover:underline">Inicia sesión</a>
        </p>
    </form>
  </div>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

  <script>
    const registerForm = document.getElementById('register');

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        nombre_usuario: registerForm.nombre_usuario.value,
        contrasena: registerForm.contrasena.value,
        rol_usuario: registerForm.rol_usuario.value
      };
      try {
        const response = await fetch("/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
        if (response.ok) {
          alert("Usuario registrado ✅");
          window.location.href = "login.html";
        } else {
          alert("Error en el registro");
        }
      } catch (error) {
        alert("Error en la conexión con el servidor");
      }
    });
  </script>
</body>
</html>
