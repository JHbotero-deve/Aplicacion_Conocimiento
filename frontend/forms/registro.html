<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Registro de Operador | Ganadería Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-lg">
        <a href="../index.html" class="inline-flex items-center text-slate-500 hover:text-emerald-400 mb-8 transition-all font-bold text-xs uppercase tracking-widest">
            <i class="fa-solid fa-arrow-left-long mr-2"></i> Volver al Inicio
        </a>

        <form id="register" class="glass rounded-[3rem] p-12 space-y-10 shadow-2xl">
            <div class="text-center">
                <div class="inline-flex w-20 h-20 bg-blue-500/10 rounded-[2rem] items-center justify-center text-blue-400 mb-6 border border-blue-500/20">
                    <i class="fa-solid fa-user-plus text-3xl"></i>
                </div>
                <h1 class="text-3xl font-black text-white uppercase tracking-tighter">Nueva Credencial</h1>
                <p class="text-slate-500 font-medium mt-2">Habilitar acceso a nuevo personal técnico</p>
            </div>

            <div class="space-y-6">
                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-3 ml-2">Nombre de Usuario</label>
                    <input type="text" name="nombre_usuario" required placeholder="Identificador de sistema"
                        class="w-full bg-white/5 border border-white/5 rounded-2xl px-6 py-5 focus:outline-none focus:border-blue-500/50 transition-all font-bold text-white">
                </div>

                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-3 ml-2">Contraseña Inicial</label>
                    <input type="password" name="contrasena" required placeholder="Seguridad alfa-numérica"
                        class="w-full bg-white/5 border border-white/5 rounded-2xl px-6 py-5 focus:outline-none focus:border-blue-500/50 transition-all font-bold text-white">
                </div>

                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-3 ml-2">Asignación de Rol Operativo</label>
                    <select name="rol_usuario" required
                        class="w-full bg-white/5 border border-white/5 rounded-2xl px-6 py-5 focus:outline-none focus:border-blue-500/50 transition-all font-bold text-white appearance-none">
                        <option value="" disabled selected>Seleccione nivel...</option>
                        <option value="admin">Administrador Central</option>
                        <option value="mayordomo">Supervisión de Predio</option>
                        <option value="veterinario">Servicios de Salud</option>
                        <option value="usuario">Operador de Campo</option>
                    </select>
                </div>

                <div class="pt-6 border-t border-white/5 space-y-6">
                    <p class="text-[10px] font-black text-emerald-500 uppercase tracking-widest flex items-center"><i class="fa-solid fa-lock-keyhole mr-2"></i> Recuperación de Acceso Offline</p>
                    <div>
                        <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-3 ml-2">Pregunta Secreta de Validación</label>
                        <select name="pregunta_seguridad" required class="w-full bg-white/5 border border-white/5 rounded-2xl px-6 py-5 font-bold text-white appearance-none">
                            <option value="¿Cuál es el nombre de tu primer mascota?">¿Cuál es el nombre de tu primer mascota?</option>
                            <option value="¿En qué vereda se encuentra tu predio natal?">¿En qué vereda se encuentra tu predio natal?</option>
                            <option value="¿Cuál es tu fabricante de maquinaria favorito?">¿Cuál es tu fabricante de maquinaria favorito?</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-3 ml-2">Respuesta Técnica</label>
                        <input type="text" name="respuesta" required placeholder="Dato único de validación"
                            class="w-full bg-white/5 border border-white/5 rounded-2xl px-6 py-5 focus:outline-none focus:border-emerald-500/50 transition-all font-bold text-white uppercase">
                    </div>
                </div>
            </div>

            <button type="submit"
                class="w-full bg-blue-600 text-white py-6 rounded-3xl hover:bg-blue-500 transition-all shadow-xl shadow-blue-900/20 font-black text-xs uppercase tracking-[0.2em]">
                Emitir Registro de Usuario
            </button>
        </form>
    </div>

    <script>
        const registerForm = document.getElementById('register');
        registerForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const formData = new FormData(registerForm);
          const data = Object.fromEntries(formData.entries());
          try {
            const response = await fetch("/register", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(data)
            });
            if (response.ok) {
              alert("SISTEMA: USUARIO REGISTRADO EXITOSAMENTE ✅");
              window.location.href = "login.html";
            } else { alert("ERROR: EL USUARIO YA EXISTE O DATOS NO VÁLIDOS"); }
          } catch (error) { alert("ERROR: SIN CONEXIÓN CON EL SERVIDOR"); }
        });
    </script>
</body>
</html>
