<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Registro | Ganadería Pro</title>
    <link rel="stylesheet" href="../assets/css/tailwind.css">
    <link rel="stylesheet" href="../assets/css/all.min.css">
    <link rel="stylesheet" href="../styles/theme.css">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6 mesh-gradient-light">

    <div class="w-full max-w-4xl space-y-8">
        <div class="flex items-center justify-between px-2">
            <button onclick="window.location.href='login.html'" class="inline-flex items-center text-slate-400 hover:text-emerald-600 transition-all font-black text-[10px] uppercase tracking-[0.2em]">
                <i class="fa-solid fa-chevron-left mr-2"></i> Retornar
            </button>
            <span class="text-[9px] font-black text-slate-300 uppercase tracking-widest">Protocolo de Alta Corporativa</span>
        </div>

        <form id="register" class="premium-panel p-10 md:p-16 space-y-12">
            <div class="text-center">
                <div class="inline-flex w-20 h-20 bg-emerald-600 rounded-[2.5rem] items-center justify-center text-white mb-6 shadow-xl shadow-emerald-900/10">
                    <i class="fa-solid fa-user-plus text-3xl"></i>
                </div>
                <h1 class="text-4xl font-black text-slate-900 uppercase tracking-tighter">Nueva Cuenta</h1>
                <p class="text-slate-400 font-bold text-xs uppercase tracking-widest mt-2">Vincule personal autorizado a su operación</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-10">
                <div class="space-y-2">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Identificador de Usuario</label>
                    <input type="text" name="nombre_usuario" required placeholder="ej. operario_villas" class="premium-input">
                </div>
                <div class="space-y-2">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Clave Maestra</label>
                    <input type="password" name="contrasena" required placeholder="••••••••" class="premium-input font-black tracking-widest">
                </div>
                <div class="space-y-2">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Rango / Rol</label>
                    <select name="rol_usuario" required class="premium-input appearance-none font-bold text-xs uppercase tracking-widest">
                        <option value="" disabled selected>SELECCIONE RANGO...</option>
                        <option value="admin">ADMINISTRADOR GLOBAL</option>
                        <option value="mayordomo">MAYORDOMO GENERAL</option>
                        <option value="veterinario">MÉDICO VETERINARIO</option>
                        <option value="usuario">OPERADOR DE CAMPO</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Pregunta de Seguridad</label>
                    <select name="pregunta_seguridad" required class="premium-input appearance-none text-[10px] font-bold">
                        <option>¿Cuál es el nombre de su primer mascota?</option>
                        <option>¿En qué vereda nació?</option>
                        <option>¿Cuál es su raza bovina favorita?</option>
                    </select>
                </div>
            </div>

            <div class="space-y-2">
                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Respuesta Secreta</label>
                <input type="text" name="respuesta" required placeholder="Su respuesta para recuperación" class="premium-input uppercase font-black">
            </div>

            <button type="submit" class="btn-premium w-full py-6 text-sm uppercase tracking-[0.2em]">
                Formalizar Vinculación
            </button>
        </form>

        <div id="footerContainer"></div>
    </div>

    <script src="../services/navigation.js"></script>
    <script>
        const registerForm = document.getElementById('register');
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(registerForm).entries());
            const API_BASE = window.location.port === '8080' ? 'http://localhost:8000' : '';
            try {
                const res = await fetch(`${API_BASE}/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });
                if (res.ok) { alert("USUARIO VINCULADO EXITOSAMENTE ✅"); window.location.href = "login.html"; }
                else { alert("ERROR: EL USUARIO YA EXISTE O DATOS NO VÁLIDOS"); }
            } catch (e) { alert("SIN CONEXIÓN"); }
        });

        document.addEventListener('DOMContentLoaded', () => {
            navigation.renderFooter('footerContainer');
        });
    </script>
</body>
</html>
