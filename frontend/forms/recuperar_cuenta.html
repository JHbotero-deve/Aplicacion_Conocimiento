<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocolo de Recuperación | Ganadería Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        select option { background-color: #0f172a; color: white; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-lg">
        <a href="login.html" class="inline-flex items-center text-slate-500 hover:text-emerald-400 mb-8 transition-all font-bold text-xs uppercase tracking-widest">
            <i class="fa-solid fa-arrow-left-long mr-2"></i> Retornar al Acceso
        </a>

        <div id="step1" class="glass rounded-[3rem] p-12 space-y-10 shadow-2xl">
            <div class="text-center">
                <div class="inline-flex w-20 h-20 bg-emerald-500/10 rounded-[2rem] items-center justify-center text-emerald-400 mb-6 border border-emerald-500/20">
                    <i class="fa-solid fa-user-shield text-3xl"></i>
                </div>
                <h2 class="text-3xl font-black text-white uppercase tracking-tighter">Recuperar Acceso</h2>
                <p class="text-slate-500 font-medium mt-2">Inicie el protocolo de validación técnica</p>
            </div>

            <div class="space-y-4">
                <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-3 ml-2">Nombre de Usuario Operador</label>
                <input type="text" id="userRecovery" class="w-full bg-white/5 border border-white/5 rounded-2xl px-6 py-5 focus:outline-none focus:border-emerald-500/50 transition-all font-bold text-white uppercase">
            </div>

            <button onclick="buscarPregunta()" class="w-full bg-emerald-600 text-[#020617] py-6 rounded-3xl font-black uppercase text-xs tracking-widest hover:bg-emerald-500 transition shadow-xl shadow-emerald-900/20">Consultar Pregunta</button>
        </div>

        <div id="step2" class="hidden glass rounded-[3rem] p-12 space-y-10 shadow-2xl animate-in fade-in zoom-in duration-500">
            <div class="text-center">
                <h2 class="text-3xl font-black text-white uppercase tracking-tighter">Validación</h2>
                <p class="text-slate-500 font-medium mt-2">Responda a la prueba de identidad</p>
            </div>

            <div class="bg-emerald-500/5 p-8 rounded-3xl border border-emerald-500/10">
                <p class="text-[10px] text-emerald-500 font-black uppercase tracking-widest mb-2">Desafío de Seguridad:</p>
                <p id="displayPregunta" class="text-lg font-bold text-white leading-relaxed"></p>
            </div>

            <div class="space-y-8">
                <div class="space-y-3">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest ml-2">Respuesta del Operador</label>
                    <div class="relative">
                        <input type="text" id="respuestaRecovery" class="w-full bg-white/5 border-2 border-white/5 rounded-2xl px-6 py-5 focus:outline-none focus:border-emerald-500/50 transition-all font-bold text-white uppercase">
                        <button onclick="activateVoice('respuestaRecovery')" class="absolute right-3 top-1/2 -translate-y-1/2 w-12 h-12 bg-white/5 text-emerald-500 rounded-xl hover:text-white transition-all flex items-center justify-center"><i class="fa-solid fa-microphone"></i></button>
                    </div>
                </div>
                <div class="space-y-3">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest ml-2">Nueva Contraseña Maestra</label>
                    <input type="password" id="newPass" class="w-full bg-white/5 border-2 border-white/5 rounded-2xl px-6 py-5 focus:outline-none focus:border-emerald-500/50 transition-all font-bold text-white">
                </div>
            </div>

            <button onclick="resetearClave()" class="w-full bg-blue-600 text-white py-6 rounded-3xl font-black uppercase text-xs tracking-widest hover:bg-blue-500 transition shadow-xl shadow-blue-900/20">Restablecer Seguridad</button>
        </div>
    </div>

    <script src="../services/voiceAssistant.js"></script>
    <script>
        async function buscarPregunta() {
            const user = document.getElementById('userRecovery').value;
            if(!user) return;
            const res = await fetch(`/recuperar/pregunta/${user}`);
            if (res.ok) {
                const data = await res.json();
                document.getElementById('displayPregunta').innerText = data.pregunta;
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
            } else { alert("ERROR: EL USUARIO NO EXISTE EN LA BASE DE DATOS CENTRAL"); }
        }

        async function resetearClave() {
            const data = {
                nombre_usuario: document.getElementById('userRecovery').value,
                respuesta: document.getElementById('respuestaRecovery').value,
                nuevaContrasena: document.getElementById('newPass').value
            };
            const res = await fetch("/recuperar/reset", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(data)
            });
            if (res.ok) {
                alert("SISTEMA: CLAVE ACTUALIZADA EXITOSAMENTE ✅");
                window.location.href = "login.html";
            } else { alert("ERROR: LA RESPUESTA PROPORCIONADA ES INCORRECTA"); }
        }

        function activateVoice(id) {
            voiceAssistant.start((corrected) => document.getElementById(id).value = corrected);
        }
    </script>
</body>
</html>
