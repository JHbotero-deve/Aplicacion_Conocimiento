<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validación de Seguridad | Ganadería Pro</title>
    <link rel="stylesheet" href="../assets/css/tailwind.css">
    <link rel="stylesheet" href="../assets/css/all.min.css">
    <link rel="stylesheet" href="../styles/theme.css">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6 mesh-gradient-light">

    <div class="w-full max-w-lg space-y-8">
        <button onclick="window.location.href='login.html'" class="inline-flex items-center text-slate-400 hover:text-emerald-600 transition-all font-black text-[10px] uppercase tracking-widest">
            <i class="fa-solid fa-arrow-left mr-2"></i> Retornar al Acceso
        </button>

        <div id="step1" class="premium-panel p-10 md:p-12 space-y-10 animate-in fade-in duration-500">
            <div class="text-center">
                <div class="inline-flex items-center justify-center w-20 h-20 bg-emerald-50 text-emerald-600 rounded-[2.5rem] mb-6 border border-emerald-100 shadow-xl shadow-emerald-900/5">
                    <i class="fa-solid fa-user-shield text-3xl"></i>
                </div>
                <h2 class="text-3xl font-black text-slate-900 tracking-tight uppercase">Seguridad</h2>
                <p class="text-slate-400 mt-2 font-bold text-xs uppercase tracking-widest">Protocolo de Recuperación</p>
            </div>

            <div class="space-y-4">
                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Identificador de Usuario</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-6 top-1/2 -translate-y-1/2 text-slate-300"></i>
                    <input type="text" id="userRecovery" class="premium-input pl-14" placeholder="ej. operador_central">
                </div>
            </div>

            <button onclick="buscarPregunta()" class="btn-premium w-full py-6 text-xs uppercase tracking-widest">
                Consultar Desafío
            </button>
        </div>

        <div id="step2" class="hidden premium-panel p-10 md:p-12 space-y-10 animate-in slide-in-from-bottom-10 duration-500">
            <div class="bg-emerald-50 p-8 rounded-3xl border border-emerald-100 text-center">
                <p class="text-[10px] text-emerald-600 font-black uppercase tracking-widest mb-3">Pregunta de Identidad:</p>
                <p id="displayPregunta" class="text-lg font-black text-slate-900 leading-tight italic"></p>
            </div>

            <div class="space-y-6">
                <div class="space-y-2">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Su Respuesta Secreta</label>
                    <input type="text" id="respuestaRecovery" class="premium-input font-bold uppercase">
                </div>
                <div class="space-y-2">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Nueva Clave Corporativa</label>
                    <input type="password" id="newPass" class="premium-input">
                </div>
            </div>

            <button onclick="resetearClave()" class="btn-premium w-full py-6 text-xs uppercase tracking-widest">
                Restablecer Credenciales
            </button>
        </div>

        <div id="footerContainer"></div>
    </div>

    <script src="../services/navigation.js"></script>
    <script>
        const API_BASE = window.location.port === '8080' ? 'http://localhost:8000' : '';

        async function buscarPregunta() {
            const user = document.getElementById('userRecovery').value;
            if(!user) return;
            try {
                const res = await fetch(`${API_BASE}/recuperar/pregunta/${encodeURIComponent(user)}`);
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('displayPregunta').innerText = data.pregunta;
                    document.getElementById('step1').classList.add('hidden');
                    document.getElementById('step2').classList.remove('hidden');
                } else { alert("USUARIO NO REGISTRADO"); }
            } catch (e) { alert("FALLO DE RED"); }
        }

        async function resetearClave() {
            const data = {
                nombre_usuario: document.getElementById('userRecovery').value,
                respuesta: document.getElementById('respuestaRecovery').value,
                nuevaContrasena: document.getElementById('newPass').value
            };
            try {
                const res = await fetch(`${API_BASE}/recuperar/reset`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(data)
                });
                if (res.ok) { alert("SEGURIDAD RESTABLECIDA ✅"); window.location.href = "login.html"; }
                else { alert("RESPUESTA INCORRECTA ❌"); }
            } catch (e) { alert("FALLO DE RED"); }
        }

        document.addEventListener('DOMContentLoaded', () => {
            navigation.renderFooter('footerContainer');
        });
    </script>
</body>
</html>
