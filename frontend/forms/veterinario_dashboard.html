<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Analytics | Ganadería Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; }
        .glass-panel { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="min-h-screen flex text-slate-400">

    <aside class="w-72 border-r border-white/5 flex flex-col z-20">
        <div class="p-8 flex items-center gap-3">
            <div class="w-10 h-10 bg-rose-500 rounded-xl flex items-center justify-center text-slate-950">
                <i class="fa-solid fa-house-medical text-xl"></i>
            </div>
            <span class="text-xl font-extrabold tracking-tighter text-white">HEALTH<span class="text-rose-500 italic">PRO</span></span>
        </div>
        <nav class="flex-1 px-4 mt-4 space-y-1">
            <button onclick="showSection('agenda')" class="w-full flex items-center gap-4 px-6 py-4 rounded-xl text-sm font-bold text-white bg-rose-500/10 border-r-2 border-rose-500 transition-all">
                <i class="fa-solid fa-calendar-check text-rose-500"></i> Agenda Médica
            </button>
            <button onclick="showSection('historial')" class="w-full flex items-center gap-4 px-6 py-4 rounded-xl text-sm font-bold hover:bg-white/5 transition-all">
                <i class="fa-solid fa-notes-medical"></i> Registro Clínico
            </button>
        </nav>
        <div class="p-6 border-t border-white/5">
            <button onclick="logout()" class="w-full flex items-center gap-4 px-6 py-4 text-sm font-bold text-rose-500 hover:bg-rose-500/5 rounded-xl transition-all">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Salida Segura
            </button>
        </div>
    </aside>

    <main class="flex-1 p-12 space-y-10 overflow-y-auto h-screen">
        <header class="flex justify-between items-center glass-panel p-8 rounded-[2.5rem]">
            <div>
                <h2 id="sectionTitle" class="text-3xl font-black text-white uppercase tracking-tighter leading-none mb-1">Agenda Médica</h2>
                <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Protocolo de Sanidad Animal</p>
            </div>
            <div class="px-6 py-2 rounded-xl bg-rose-500/10 text-rose-500 font-bold text-xs uppercase tracking-widest border border-rose-500/20">Médico Veterinario</div>
        </header>

        <section id="agenda" class="space-y-8">
            <div class="flex justify-between items-center px-4">
                <h3 class="text-xs font-black text-slate-500 uppercase tracking-widest">Procedimientos Programados</h3>
                <button onclick="openModal('modalCita')" class="px-8 py-3 rounded-xl bg-rose-600 text-white font-black text-xs uppercase tracking-widest hover:bg-rose-500 shadow-xl shadow-rose-900/20 transition-all">Programar Intervención</button>
            </div>
            <div class="glass-panel rounded-[2.5rem] overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-white/5 text-slate-500 text-[10px] font-black uppercase tracking-widest border-b border-white/5">
                        <tr>
                            <th class="p-8">Marca Temporal</th>
                            <th class="p-8">Unidad Predial</th>
                            <th class="p-8">Tipo de Intervención</th>
                            <th class="p-8 text-right">Estatus</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCitas" class="divide-y divide-white/5 text-sm">
                        <!-- Data -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const token = localStorage.getItem("token");
        if (!token) window.location.href = "login.html";
        function logout() { localStorage.removeItem("token"); window.location.href = "login.html"; }
        function showSection(id) { /* logic */ }
    </script>
</body>
</html>
