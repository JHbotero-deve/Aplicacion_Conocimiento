<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal de Campo | Ganadería Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; }
        .action-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12 flex flex-col items-center pb-32">

    <div class="w-full max-w-md space-y-10">
        <!-- Header Minimalista -->
        <header class="flex justify-between items-center bg-white/5 p-8 rounded-[2.5rem] border border-white/5 backdrop-blur-md">
            <div class="flex items-center gap-5">
                <div class="w-14 h-14 bg-emerald-500 rounded-2xl flex items-center justify-center font-black text-xl text-[#020617]">
                    <i class="fa-solid fa-cow"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black text-white uppercase tracking-tighter leading-none mb-1">Terminal Campo</h1>
                    <p id="userNameDisplay" class="text-[10px] text-slate-500 font-black uppercase tracking-widest">Operador Activo</p>
                </div>
            </div>
            <button onclick="logout()" class="w-12 h-12 bg-rose-500/10 text-rose-500 rounded-xl hover:bg-rose-500/20 transition-all flex items-center justify-center">
                <i class="fa-solid fa-power-off text-xl"></i>
            </button>
        </header>

        <!-- Grid de Operaciones (Limpio) -->
        <div class="grid grid-cols-2 gap-6">
            <a href="produccion.html" class="bg-blue-600 p-10 rounded-[2.5rem] text-white text-center shadow-2xl shadow-blue-900/20 hover:scale-[1.02] transition-all">
                <i class="fa-solid fa-flask-round-potion text-4xl mb-4"></i>
                <p class="font-black uppercase text-[10px] tracking-[0.2em]">Producción</p>
            </a>
            <a href="tratamientos.html" class="bg-rose-600 p-10 rounded-[2.5rem] text-white text-center shadow-2xl shadow-rose-900/20 hover:scale-[1.02] transition-all">
                <i class="fa-solid fa-kit-medical text-4xl mb-4"></i>
                <p class="font-black uppercase text-[10px] tracking-[0.2em]">Sanidad</p>
            </a>
            <a href="novedades.html" class="bg-slate-800 p-10 rounded-[2.5rem] text-white text-center shadow-2xl shadow-black/20 hover:scale-[1.02] transition-all">
                <i class="fa-solid fa-clipboard-list text-4xl mb-4 text-slate-400"></i>
                <p class="font-black uppercase text-[10px] tracking-[0.2em]">Bitácora</p>
            </a>
            <a href="registro_ganado.html" class="bg-emerald-600 p-10 rounded-[2.5rem] text-white text-center shadow-2xl shadow-emerald-900/20 hover:scale-[1.02] transition-all">
                <i class="fa-solid fa-plus-circle text-4xl mb-4"></i>
                <p class="font-black uppercase text-[10px] tracking-[0.2em]">Inventario</p>
            </a>
        </div>

        <!-- Alertas Técnicas -->
        <div class="space-y-4">
            <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-4">Notificaciones de Predio</h3>
            <div class="bg-emerald-500/5 border border-emerald-500/10 p-8 rounded-[2.5rem] flex items-center gap-6">
                <div class="w-12 h-12 bg-emerald-500/10 text-emerald-500 rounded-xl flex items-center justify-center animate-pulse">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <div>
                    <p class="text-sm font-bold text-white leading-none mb-1">Sincronización Exitosa</p>
                    <p class="text-xs text-slate-500 font-medium">Todos los registros están en el servidor.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Barra de Navegación Fija -->
    <nav class="fixed bottom-8 left-6 right-6 max-w-md mx-auto bg-white/5 border border-white/5 p-4 flex justify-around items-center rounded-3xl backdrop-blur-2xl shadow-2xl">
        <button class="text-emerald-500 flex flex-col items-center gap-1.5 transition-all">
            <i class="fa-solid fa-house-chimney text-lg"></i>
            <span class="text-[8px] font-black uppercase tracking-widest">Inicio</span>
        </button>
        <a href="perfil.html" class="text-slate-500 flex flex-col items-center gap-1.5 hover:text-white transition-all">
            <i class="fa-solid fa-user-gear text-lg"></i>
            <span class="text-[8px] font-black uppercase tracking-widest">Perfil</span>
        </a>
    </nav>

    <script>
        function logout() { localStorage.removeItem("token"); window.location.href = "login.html"; }
    </script>
</body>
</html>
