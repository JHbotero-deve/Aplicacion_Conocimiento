<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal de Campo | Ganadería Pro</title>
    <link rel="stylesheet" href="../assets/css/tailwind.css">
    <link rel="stylesheet" href="../assets/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; background: #020617; }
        .action-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12 flex flex-col items-center pb-32">

    <div class="w-full max-w-md space-y-10">
        <!-- Header Minimalista -->
        <header class="flex justify-between items-center bg-white/5 p-8 rounded-[2.5rem] border border-white/5 backdrop-blur-md">
            <div class="flex items-center gap-5">
                <div class="w-14 h-14 bg-emerald-500 rounded-2xl flex items-center justify-center font-black text-xl text-[#020617]">
                    <i class="fa-solid fa-cow"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black text-white uppercase tracking-tighter leading-none mb-1">Terminal Campo</h1>
                    <p id="userNameDisplay" class="text-[10px] text-slate-500 font-black uppercase tracking-widest">Operador Activo</p>
                </div>
            </div>
            <button onclick="navigation.logout()" class="w-12 h-12 bg-rose-500/10 text-rose-500 rounded-xl hover:bg-rose-500/20 transition-all flex items-center justify-center">
                <i class="fa-solid fa-power-off text-xl"></i>
            </button>
        </header>

        <!-- Grid de Operaciones (Limpio) -->
        <div class="grid grid-cols-2 gap-6">
            <a href="produccion.html" class="bg-blue-600 p-10 rounded-[2.5rem] text-white text-center shadow-2xl shadow-blue-900/20 hover:scale-[1.02] transition-all">
                <i class="fa-solid fa-flask-round-potion text-4xl mb-4"></i>
                <p class="font-black uppercase text-[10px] tracking-[0.2em]">Producción</p>
            </a>
            <a href="tratamientos.html" class="bg-rose-600 p-10 rounded-[2.5rem] text-white text-center shadow-2xl shadow-rose-900/20 hover:scale-[1.02] transition-all">
                <i class="fa-solid fa-kit-medical text-4xl mb-4"></i>
                <p class="font-black uppercase text-[10px] tracking-[0.2em]">Sanidad</p>
            </a>
            <a href="novedades.html" class="bg-slate-800 p-10 rounded-[2.5rem] text-white text-center shadow-2xl shadow-black/20 hover:scale-[1.02] transition-all">
                <i class="fa-solid fa-clipboard-list text-4xl mb-4 text-slate-400"></i>
                <p class="font-black uppercase text-[10px] tracking-[0.2em]">Bitácora</p>
            </a>
            <a href="registro_ganado.html" class="bg-emerald-600 p-10 rounded-[2.5rem] text-white text-center shadow-2xl shadow-emerald-900/20 hover:scale-[1.02] transition-all">
                <i class="fa-solid fa-plus-circle text-4xl mb-4"></i>
                <p class="font-black uppercase text-[10px] tracking-[0.2em]">Inventario</p>
            </a>
        </div>

        <!-- Estado de Sincronización (Visual para el campo) -->
        <div id="syncStatusBanner" class="bg-slate-900 border border-white/10 p-6 rounded-[2rem] flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div id="syncIcon" class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-500 flex items-center justify-center">
                    <i class="fa-solid fa-cloud-check"></i>
                </div>
                <div>
                    <p id="syncText" class="text-xs font-black text-white uppercase tracking-tight">Sistema al día</p>
                    <p id="syncSubtext" class="text-[9px] text-slate-500 font-bold uppercase">Listo para trabajar offline</p>
                </div>
            </div>
            <div id="pendingBadge" class="hidden px-3 py-1 rounded-full bg-amber-500 text-slate-950 text-[10px] font-black animate-bounce">
                0 PENDIENTES
            </div>
        </div>

        <!-- Auditoría Local (Mis Registros de Hoy) -->
        <div class="space-y-4">
            <div class="flex justify-between items-center px-4">
                <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Mis Registros de Hoy</h3>
                <button onclick="renderLocalAudit()" class="text-emerald-500 text-[8px] font-black uppercase tracking-widest hover:underline">Actualizar</button>
            </div>
            <div id="localAuditList" class="space-y-3">
                <!-- Data dinámica de auditoría local -->
            </div>
        </div>

        <!-- Alertas Técnicas -->
        <div class="space-y-4">
            <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-4">Notificaciones de Predio</h3>
            <div class="bg-emerald-500/5 border border-emerald-500/10 p-8 rounded-[2.5rem] flex items-center gap-6">
                <div class="w-12 h-12 bg-emerald-500/10 text-emerald-500 rounded-xl flex items-center justify-center animate-pulse">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <div>
                    <p class="text-sm font-bold text-white leading-none mb-1">Sincronización Exitosa</p>
                    <p class="text-xs text-slate-500 font-medium">Todos los registros están en el servidor.</p>
                </div>
            </div>
        </div>

        <!-- Footer Corporativo -->
        <div id="footerContainer"></div>
    </div>

    <!-- Barra de Navegación Fija -->
    <nav class="fixed bottom-8 left-6 right-6 max-w-md mx-auto bg-white/5 border border-white/5 p-4 flex justify-around items-center rounded-3xl backdrop-blur-2xl shadow-2xl">
        <button class="text-emerald-500 flex flex-col items-center gap-1.5 transition-all">
            <i class="fa-solid fa-house-chimney text-lg"></i>
            <span class="text-[8px] font-black uppercase tracking-widest">Inicio</span>
        </button>
        <a href="perfil.html" class="text-slate-500 flex flex-col items-center gap-1.5 hover:text-white transition-all">
            <i class="fa-solid fa-user-gear text-lg"></i>
            <span class="text-[8px] font-black uppercase tracking-widest">Perfil</span>
        </a>
    </nav>

    <script src="../services/navigation.js"></script>
    <script src="../services/offlineSync.js"></script>
    <script>
        async function updateSyncUI() {
            if (!window.offlineSync) return;
            const count = await window.offlineSync.refreshStatus();
            const banner = document.getElementById('syncStatusBanner');
            const icon = document.getElementById('syncIcon');
            const text = document.getElementById('syncText');
            const badge = document.getElementById('pendingBadge');

            if (count > 0) {
                banner.classList.add('border-amber-500/30');
                icon.className = 'w-10 h-10 rounded-xl bg-amber-500/10 text-amber-500 flex items-center justify-center';
                icon.innerHTML = '<i class="fa-solid fa-cloud-arrow-up animate-pulse"></i>';
                text.innerText = 'Pendientes por subir';
                badge.innerText = `${count} PENDIENTES`;
                badge.classList.remove('hidden');
            } else {
                banner.classList.remove('border-amber-500/30');
                icon.className = 'w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-500 flex items-center justify-center';
                icon.innerHTML = '<i class="fa-solid fa-cloud-check"></i>';
                text.innerText = 'Sistema al día';
                badge.classList.add('hidden');
            }
        }

        async function renderLocalAudit() {
            if (!window.offlineSync) return;
            const records = await window.offlineSync.getAllRecords();
            const list = document.getElementById('localAuditList');
            const today = new Date().toLocaleDateString();

            const dailyRecords = records.filter(r => new Date(r.createdAt).toLocaleDateString() === today);

            if (dailyRecords.length === 0) {
                list.innerHTML = '<p class="text-[10px] text-slate-600 text-center italic">No hay registros pendientes para hoy.</p>';
                return;
            }

            list.innerHTML = dailyRecords.map(r => `
                <div class="bg-white/5 border border-white/5 p-5 rounded-2xl flex justify-between items-center animate-in slide-in-from-left-4 duration-300">
                    <div class="flex items-center gap-4">
                        <div class="w-8 h-8 rounded-lg ${r.path.includes('produccion') ? 'bg-blue-500/10 text-blue-500' : 'bg-emerald-500/10 text-emerald-500'} flex items-center justify-center text-xs">
                            <i class="fa-solid ${r.path.includes('produccion') ? 'fa-flask' : 'fa-cow'}"></i>
                        </div>
                        <div>
                            <p class="text-xs font-bold text-white leading-none">${r.body.ganado_id || 'Nuevo Animal'}</p>
                            <p class="text-[8px] text-slate-500 font-bold uppercase tracking-widest mt-1">${r.path.split('/').pop()}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-xs font-black text-emerald-400">${r.body.cantidad || r.body.peso || ''} ${r.body.unidad || 'Kg'}</p>
                        <p class="text-[8px] text-slate-600 font-bold">${new Date(r.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>
                    </div>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderLocalAudit();
            updateSyncUI();
            navigation.renderFooter('footerContainer');

            // Escuchar cambios de red para actualizar la UI
            window.addEventListener('online', () => {
                setTimeout(updateSyncUI, 2000); // Dar tiempo al sync real
            });
            window.addEventListener('offline', updateSyncUI);
        });
    </script>
</body>
</html>
