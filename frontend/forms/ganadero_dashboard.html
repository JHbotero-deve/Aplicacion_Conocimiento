<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal de Campo | Ganadería Pro</title>
    <link rel="stylesheet" href="../assets/css/tailwind.css">
    <link rel="stylesheet" href="../assets/css/all.min.css">
    <link rel="stylesheet" href="../styles/theme.css">
    <style>
        body { background: #f8fafc; color: #0f172a; }
        .action-card { background: white; border: 1px solid rgba(16, 185, 129, 0.1); box-shadow: var(--shadow-premium); }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12 flex flex-col items-center pb-32 mesh-gradient-light">

    <div class="w-full max-w-md space-y-10">
        <!-- Header Minimalista -->
        <header class="flex justify-between items-center bg-white p-8 rounded-[2.5rem] border border-emerald-100 shadow-xl shadow-emerald-900/5">
            <div class="flex items-center gap-5">
                <div class="w-14 h-14 bg-emerald-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-emerald-200">
                    <i class="fa-solid fa-cow text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black text-slate-900 uppercase tracking-tighter leading-none mb-1">Terminal Campo</h1>
                    <p id="userNameDisplay" class="text-[10px] text-emerald-600 font-black uppercase tracking-widest">Operador Activo</p>
                </div>
            </div>
            <button onclick="navigation.logout()" class="w-12 h-12 bg-rose-50 text-rose-600 rounded-xl hover:bg-rose-100 transition-all flex items-center justify-center border border-rose-100">
                <i class="fa-solid fa-power-off text-xl"></i>
            </button>
        </header>

        <!-- Grid de Operaciones (Limpio y Claro) -->
        <div class="grid grid-cols-2 gap-6">
            <a href="produccion.html" class="bg-white p-10 rounded-[2.5rem] text-center border border-blue-100 shadow-xl shadow-blue-900/5 hover:scale-[1.02] transition-all group">
                <div class="w-14 h-14 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 group-hover:bg-blue-600 group-hover:text-white transition-all">
                    <i class="fa-solid fa-flask-vial text-2xl"></i>
                </div>
                <p class="font-black uppercase text-[10px] tracking-[0.2em] text-slate-400 group-hover:text-blue-600">Producción</p>
            </a>
            <a href="tratamientos.html" class="bg-white p-10 rounded-[2.5rem] text-center border border-rose-100 shadow-xl shadow-rose-900/5 hover:scale-[1.02] transition-all group">
                <div class="w-14 h-14 bg-rose-50 text-rose-600 rounded-2xl flex items-center justify-center mx-auto mb-4 group-hover:bg-rose-600 group-hover:text-white transition-all">
                    <i class="fa-solid fa-kit-medical text-2xl"></i>
                </div>
                <p class="font-black uppercase text-[10px] tracking-[0.2em] text-slate-400 group-hover:text-rose-600">Sanidad</p>
            </a>
            <a href="novedades.html" class="bg-white p-10 rounded-[2.5rem] text-center border border-slate-100 shadow-xl shadow-slate-900/5 hover:scale-[1.02] transition-all group">
                <div class="w-14 h-14 bg-slate-50 text-slate-600 rounded-2xl flex items-center justify-center mx-auto mb-4 group-hover:bg-slate-900 group-hover:text-white transition-all">
                    <i class="fa-solid fa-clipboard-list text-2xl"></i>
                </div>
                <p class="font-black uppercase text-[10px] tracking-[0.2em] text-slate-400 group-hover:text-slate-900">Bitácora</p>
            </a>
            <a href="registro_ganado.html" class="bg-white p-10 rounded-[2.5rem] text-center border border-emerald-100 shadow-xl shadow-emerald-900/5 hover:scale-[1.02] transition-all group">
                <div class="w-14 h-14 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-4 group-hover:bg-emerald-600 group-hover:text-white transition-all">
                    <i class="fa-solid fa-plus-circle text-2xl"></i>
                </div>
                <p class="font-black uppercase text-[10px] tracking-[0.2em] text-slate-400 group-hover:text-emerald-600">Inventario</p>
            </a>
        </div>

        <!-- Estado de Sincronización -->
        <div id="syncStatusBanner" class="bg-white border border-slate-100 p-6 rounded-[2rem] flex items-center justify-between shadow-lg shadow-slate-900/5">
            <div class="flex items-center gap-4">
                <div id="syncIcon" class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center border border-emerald-100">
                    <i class="fa-solid fa-cloud-check"></i>
                </div>
                <div>
                    <p id="syncText" class="text-xs font-black text-slate-900 uppercase tracking-tight">Sistema al día</p>
                    <p id="syncSubtext" class="text-[9px] text-slate-400 font-bold uppercase tracking-wider">Listo para el campo</p>
                </div>
            </div>
            <div id="pendingBadge" class="hidden px-3 py-1 rounded-full bg-amber-500 text-white text-[9px] font-black animate-bounce">
                0 PENDIENTES
            </div>
        </div>

        <!-- Auditoría Local -->
        <div class="space-y-4">
            <div class="flex justify-between items-center px-4">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Registros de hoy</h3>
                <button onclick="renderLocalAudit()" class="text-emerald-600 text-[8px] font-black uppercase tracking-widest hover:underline">Actualizar</button>
            </div>
            <div id="localAuditList" class="space-y-3"></div>
        </div>

        <!-- Footer -->
        <div id="footerContainer"></div>
    </div>

    <!-- Navegación Inferior Blanca -->
    <nav class="fixed bottom-8 left-6 right-6 max-w-md mx-auto bg-white/90 border border-emerald-100 p-4 flex justify-around items-center rounded-3xl backdrop-blur-xl shadow-2xl">
        <button class="text-emerald-600 flex flex-col items-center gap-1.5 transition-all">
            <i class="fa-solid fa-house-chimney text-lg"></i>
            <span class="text-[8px] font-black uppercase tracking-widest">Inicio</span>
        </button>
        <a href="perfil.html" class="text-slate-400 flex flex-col items-center gap-1.5 hover:text-emerald-600 transition-all">
            <i class="fa-solid fa-user-gear text-lg"></i>
            <span class="text-[8px] font-black uppercase tracking-widest">Perfil</span>
        </a>
    </nav>

    <script src="../services/navigation.js"></script>
    <script src="../services/offlineSync.js"></script>
    <script>
        async function updateSyncUI() {
            if (!window.offlineSync) return;
            const count = await window.offlineSync.refreshStatus();
            const banner = document.getElementById('syncStatusBanner');
            const icon = document.getElementById('syncIcon');
            const text = document.getElementById('syncText');
            const badge = document.getElementById('pendingBadge');

            if (count > 0) {
                icon.className = 'w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center border border-amber-100';
                icon.innerHTML = '<i class="fa-solid fa-cloud-arrow-up animate-pulse"></i>';
                text.innerText = 'Pendientes por subir';
                badge.innerText = `${count} PENDIENTES`;
                badge.classList.remove('hidden');
            } else {
                icon.className = 'w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center border border-emerald-100';
                icon.innerHTML = '<i class="fa-solid fa-cloud-check"></i>';
                text.innerText = 'Sistema al día';
                badge.classList.add('hidden');
            }
        }

        async function renderLocalAudit() {
            if (!window.offlineSync) return;
            const records = await window.offlineSync.getAllRecords();
            const list = document.getElementById('localAuditList');
            const today = new Date().toLocaleDateString();
            const dailyRecords = records.filter(r => new Date(r.createdAt).toLocaleDateString() === today);

            if (dailyRecords.length === 0) {
                list.innerHTML = '<p class="text-[10px] text-slate-300 text-center italic">No hay registros hoy.</p>';
                return;
            }

            list.innerHTML = dailyRecords.map(r => `
                <div class="bg-white border border-slate-50 p-5 rounded-3xl flex justify-between items-center shadow-sm">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-xl ${r.path.includes('produccion') ? 'bg-blue-50 text-blue-600' : 'bg-emerald-50 text-emerald-600'} flex items-center justify-center text-sm border border-slate-100">
                            <i class="fa-solid ${r.path.includes('produccion') ? 'fa-flask' : 'fa-cow'}"></i>
                        </div>
                        <div>
                            <p class="text-xs font-black text-slate-900">${r.body.ganado_id || 'Censo ICA'}</p>
                            <p class="text-[8px] text-slate-400 font-bold uppercase mt-1 tracking-widest">${r.path.split('/').pop()}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-xs font-black text-emerald-600">${r.body.cantidad || r.body.peso || ''} ${r.body.unidad || 'Kg'}</p>
                        <p class="text-[8px] text-slate-300 font-bold">${new Date(r.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>
                    </div>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderLocalAudit();
            updateSyncUI();
            navigation.renderFooter('footerContainer');
            window.addEventListener('online', () => setTimeout(updateSyncUI, 2000));
            window.addEventListener('offline', updateSyncUI);
        });
    </script>
</body>
</html>
