<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Métricas de Producción | Ganadería Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12 flex flex-col items-center">

    <div class="w-full max-w-4xl space-y-10">
        <div class="flex justify-between items-center bg-white/5 p-8 rounded-[2rem] border border-white/5">
            <div class="flex items-center gap-6">
                <div class="w-14 h-14 bg-blue-500 rounded-2xl flex items-center justify-center text-[#020617]">
                    <i class="fa-solid fa-flask-vial text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-white uppercase tracking-tighter">Captura de Datos</h1>
                    <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Producción Diaria de Hato</p>
                </div>
            </div>
            <button onclick="navigation.goBack()" class="px-6 py-3 rounded-xl bg-white/5 text-slate-300 font-bold text-xs uppercase hover:bg-white/10 transition-all">Dashboard</button>
        </div>

        <form id="formProduccion" class="glass rounded-[3rem] p-10 md:p-16 space-y-12 text-center">

            <div class="inline-flex p-2 bg-white/5 rounded-2xl mb-4 border border-white/5">
                <button type="button" onclick="setType('Leche')" id="btnLeche" class="px-10 py-3 rounded-xl font-black uppercase text-xs tracking-widest transition-all bg-blue-600 text-white shadow-xl shadow-blue-900/20">Lácteos</button>
                <button type="button" onclick="setType('Carne')" id="btnCarne" class="px-10 py-3 rounded-xl font-black uppercase text-xs tracking-widest transition-all text-slate-500 hover:text-white">Cárnicos</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-12 text-left">
                <div class="space-y-3">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest ml-2">Identificación Animal</label>
                    <div class="relative">
                        <input type="text" id="prod_animal" name="ganado_id" required placeholder="Hablar chapeta..."
                            class="w-full bg-white/5 border-2 border-white/5 rounded-2xl px-6 py-5 focus:outline-none focus:border-blue-500/50 transition-all font-bold text-2xl text-white">
                        <button type="button" onclick="activateVoice('prod_animal')" class="absolute right-3 top-1/2 -translate-y-1/2 w-12 h-12 bg-blue-500/10 text-blue-500 rounded-xl flex items-center justify-center"><i class="fa-solid fa-microphone"></i></button>
                    </div>
                </div>

                <div class="space-y-3">
                    <label id="labelCantidad" class="block text-[10px] font-black text-slate-500 uppercase tracking-widest ml-2">Volumen Capturado (Litros)</label>
                    <div class="relative">
                        <input type="number" step="0.1" id="prod_cantidad" name="cantidad" required placeholder="0.0"
                            class="w-full bg-white/5 border-2 border-white/5 rounded-2xl px-6 py-5 focus:outline-none focus:border-emerald-500/50 transition-all font-black text-4xl text-emerald-400">
                        <button type="button" onclick="activateVoice('prod_cantidad')" class="absolute right-3 top-1/2 -translate-y-1/2 w-12 h-12 bg-emerald-500/10 text-emerald-500 rounded-xl flex items-center justify-center"><i class="fa-solid fa-microphone"></i></button>
                    </div>
                </div>
            </div>

            <input type="hidden" name="tipo" id="prod_tipo" value="Leche">

            <button type="submit" class="w-full bg-blue-600 text-white py-6 rounded-[2rem] font-black text-lg uppercase tracking-widest hover:bg-blue-500 transition-all shadow-2xl shadow-blue-900/20">
                Sincronizar Datos de Producción
            </button>
        </form>
    </div>

    <script src="../services/navigation.js"></script>
    <script src="../services/voiceAssistant.js"></script>
    <script>
        function setType(t) {
            document.getElementById('prod_tipo').value = t;
            document.getElementById('labelCantidad').innerText = t === 'Leche' ? 'Volumen Capturado (Litros)' : 'Masa Corporal (Kilos)';
            document.getElementById('btnLeche').className = t === 'Leche' ? 'px-10 py-3 rounded-xl font-black uppercase text-xs tracking-widest transition-all bg-blue-600 text-white shadow-xl' : 'px-10 py-3 rounded-xl font-black uppercase text-xs tracking-widest transition-all text-slate-500 hover:text-white';
            document.getElementById('btnCarne').className = t === 'Carne' ? 'px-10 py-3 rounded-xl font-black uppercase text-xs tracking-widest transition-all bg-amber-600 text-white shadow-xl' : 'px-10 py-3 rounded-xl font-black uppercase text-xs tracking-widest transition-all text-slate-500 hover:text-white';
        }
        function activateVoice(id) {
            voiceAssistant.start((corrected) => document.getElementById(id).value = corrected);
        }
    </script>
</body>
</html>
