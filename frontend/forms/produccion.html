<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Métricas de Producción | Ganadería Pro</title>
    <link rel="stylesheet" href="../assets/css/tailwind.css">
    <link rel="stylesheet" href="../assets/css/all.min.css">
    <link rel="stylesheet" href="../styles/theme.css">
</head>
<body class="min-h-screen p-6 md:p-12 flex flex-col items-center mesh-gradient-light">

    <div class="w-full max-w-4xl space-y-10">
        <div class="premium-card p-8 flex justify-between items-center border-blue-100">
            <div class="flex items-center gap-6">
                <div class="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-blue-200">
                    <i class="fa-solid fa-flask-vial text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-slate-900 uppercase tracking-tighter">Captura de Datos</h1>
                    <p class="text-[10px] font-black text-blue-600 uppercase tracking-widest">Producción Diaria de Hato</p>
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="startHandsFree()" class="px-6 py-3 rounded-xl bg-emerald-50 text-emerald-700 font-black text-xs uppercase hover:bg-emerald-100 transition-all border border-emerald-100">
                    <i class="fa-solid fa-headset mr-2"></i> Modo Voz
                </button>
                <button onclick="navigation.goBack()" class="px-6 py-3 rounded-xl bg-slate-50 text-slate-600 font-bold text-xs uppercase hover:bg-slate-100 transition-all border border-slate-100">Cerrar</button>
            </div>
        </div>

        <form id="formProduccion" class="premium-panel p-10 md:p-16 space-y-12 text-center">

            <div class="inline-flex p-2 bg-slate-50 rounded-2xl mb-8 border border-slate-100">
                <button type="button" onclick="setType('Leche')" id="btnLeche" class="px-10 py-3 rounded-xl font-black uppercase text-[10px] tracking-widest transition-all bg-blue-600 text-white shadow-lg shadow-blue-200">Lácteos</button>
                <button type="button" onclick="setType('Carne')" id="btnCarne" class="px-10 py-3 rounded-xl font-black uppercase text-[10px] tracking-widest transition-all text-slate-400 hover:text-slate-600">Cárnicos</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-12 text-left">
                <div class="space-y-3">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Identificación Animal</label>
                    <div class="relative">
                        <input type="text" id="prod_animal" name="ganado_id" required placeholder="Nro de Chapeta"
                            class="premium-input text-xl font-black">
                        <button type="button" onclick="activateVoice('prod_animal')" class="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center">
                            <i class="fa-solid fa-microphone"></i>
                        </button>
                    </div>
                </div>

                <div class="space-y-3">
                    <label id="labelCantidad" class="block text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Cantidad (Litros)</label>
                    <div class="relative">
                        <input type="number" step="0.1" id="prod_cantidad" name="cantidad" required placeholder="0.0"
                            class="premium-input text-3xl font-black text-emerald-600">
                        <button type="button" onclick="activateVoice('prod_cantidad')" class="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center">
                            <i class="fa-solid fa-microphone"></i>
                        </button>
                    </div>
                </div>
            </div>

            <input type="hidden" name="tipo" id="prod_tipo" value="Leche">

            <button type="submit" class="btn-premium w-full py-6 text-lg bg-gradient-to-r from-blue-700 to-blue-500 shadow-blue-200">
                <i class="fa-solid fa-cloud-arrow-up"></i> Sincronizar Producción
            </button>
        </form>

        <div id="footerContainer"></div>
    </div>

    <script src="../services/navigation.js"></script>
    <script src="../services/voiceAssistant.js"></script>
    <script src="../services/offlineSync.js"></script>
    <script src="../services/auditHelper.js"></script>
    <script>
        function setType(t) {
            document.getElementById('prod_tipo').value = t;
            document.getElementById('labelCantidad').innerText = t === 'Leche' ? 'Cantidad (Litros)' : 'Masa (Kg)';
            document.getElementById('btnLeche').className = t === 'Leche' ? 'px-10 py-3 rounded-xl font-black uppercase text-[10px] tracking-widest transition-all bg-blue-600 text-white shadow-lg' : 'px-10 py-3 rounded-xl font-black uppercase text-[10px] tracking-widest transition-all text-slate-400 hover:text-slate-600';
            document.getElementById('btnCarne').className = t === 'Carne' ? 'px-10 py-3 rounded-xl font-black uppercase text-[10px] tracking-widest transition-all bg-emerald-600 text-white shadow-lg' : 'px-10 py-3 rounded-xl font-black uppercase text-[10px] tracking-widest transition-all text-slate-400 hover:text-slate-600';
        }

        function activateVoice(fieldId, category = null) {
            const btn = event.currentTarget;
            const icon = btn.querySelector('i');
            const originalIcon = icon.className;
            icon.className = 'fa-solid fa-circle-notch fa-spin';

            if (fieldId === 'prod_cantidad') {
                category = document.getElementById('prod_tipo').value === 'Leche' ? 'leche' : 'produccion';
            }

            voiceAssistant.start((corrected, original, anomaly) => {
                document.getElementById(fieldId).value = corrected;
                if (anomaly) voiceAssistant.speak(anomaly);
                else voiceAssistant.speak(`Entendido: ${corrected}`);
                icon.className = originalIcon;
            }, (err) => { icon.className = originalIcon; }, category);
        }

        async function startHandsFree() {
            const fields = [
                { id: 'prod_animal', label: 'el número de chapeta', category: 'generales' },
                { id: 'prod_cantidad', label: 'la cantidad producida', category: document.getElementById('prod_tipo').value === 'Leche' ? 'leche' : 'produccion' }
            ];
            await voiceAssistant.startSequence(fields, () => {
                document.getElementById('formProduccion').dispatchEvent(new Event('submit'));
            });
        }

        document.getElementById('formProduccion').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(e.target).entries());
            try {
                const result = await window.offlineSync.submit('/operaciones/produccion', data);
                voiceAssistant.speak(result.queued ? "Guardado sin señal" : "Sincronizado");
                alert("REGISTRO EXITOSO ✅");
                e.target.reset();
            } catch (error) { alert("ERROR: " + error.message); }
        });

        document.addEventListener('DOMContentLoaded', () => {
            navigation.renderFooter('footerContainer');
        });
    </script>
</body>
</html>
