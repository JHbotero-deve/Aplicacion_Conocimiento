<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Ganado - Sistema Ganadero</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-green-100 to-green-200 min-h-screen flex items-center justify-center p-4">

  <form id="ganadoForm" class="w-full max-w-lg bg-white rounded-xl shadow-xl p-8 space-y-6">
    <h2 class="text-3xl font-bold text-center text-green-700">Registro de Ganado</h2>
    
    <!-- Chapeta -->
    <div>
      <label class="block text-sm font-medium text-gray-700">Chapeta</label>
      <input type="text" name="chapeta" minlength="5" required
        class="mt-1 w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
      <small class="text-red-600 hidden" id="errorChapeta">⚠️ La chapeta debe tener al menos 5 caracteres</small>
    </div>

    <!-- Raza -->
    <div>
      <label class="block text-sm font-medium text-gray-700">Raza</label>
      <input type="text" name="raza" minlength="3" required
        class="mt-1 w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
      <small class="text-red-600 hidden" id="errorRaza">⚠️ La raza debe tener mínimo 3 caracteres</small>
    </div>

    <!-- Edad -->
    <div>
      <label class="block text-sm font-medium text-gray-700">Edad (años)</label>
      <input type="number" name="edad" min="1" required
        class="mt-1 w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
      <small class="text-red-600 hidden" id="errorEdad">⚠️ La edad debe ser mayor a 0</small>
    </div>

    <!-- Peso -->
    <div>
      <label class="block text-sm font-medium text-gray-700">Peso (kg)</label>
      <input type="number" step="0.01" name="peso" min="50" required
        class="mt-1 w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
      <small class="text-red-600 hidden" id="errorPeso">⚠️ El peso debe ser mayor a 50 kg</small>
    </div>

    <!-- Fecha ingreso -->
    <div>
      <label class="block text-sm font-medium text-gray-700">Fecha de ingreso</label>
      <input type="date" name="fecha_ingreso" required
        class="mt-1 w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
    </div>

    <!-- Estado ICA -->
    <div>
      <label class="block text-sm font-medium text-gray-700">Estado ICA</label>
      <select name="estadoICA" required
        class="mt-1 w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
        <option value="">Selecciona...</option>
        <option value="activo">Activo</option>
        <option value="inactivo">Inactivo</option>
      </select>
      <small class="text-red-600 hidden" id="errorICA">⚠️ Debes seleccionar un estado ICA</small>
    </div>

    <!-- Botones -->
    <button type="submit"
      class="w-full bg-green-700 text-white py-2 rounded-lg hover:bg-green-600 transition">
      Registrar Ganado
    </button>
    <button type="button" onclick="window.location.href='login.html'"
      class="w-full bg-gray-700 text-white py-2 rounded-lg hover:bg-gray-600 transition">
      ⬅️ Volver al Login
    </button>
  </form>

  <script>
    const ganadoForm = document.getElementById('ganadoForm');

    ganadoForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      let valid = true;

      // Validaciones personalizadas
      if (ganadoForm.chapeta.value.length < 5) {
        document.getElementById("errorChapeta").classList.remove("hidden");
        valid = false;
      } else {
        document.getElementById("errorChapeta").classList.add("hidden");
      }

      if (ganadoForm.raza.value.length < 3) {
        document.getElementById("errorRaza").classList.remove("hidden");
        valid = false;
      } else {
        document.getElementById("errorRaza").classList.add("hidden");
      }

      if (ganadoForm.edad.value < 1) {
        document.getElementById("errorEdad").classList.remove("hidden");
        valid = false;
      } else {
        document.getElementById("errorEdad").classList.add("hidden");
      }

      if (ganadoForm.peso.value < 50) {
        document.getElementById("errorPeso").classList.remove("hidden");
        valid = false;
      } else {
        document.getElementById("errorPeso").classList.add("hidden");
      }

      if (!ganadoForm.estadoICA.value) {
        document.getElementById("errorICA").classList.remove("hidden");
        valid = false;
      } else {
        document.getElementById("errorICA").classList.add("hidden");
      }

      if (!valid) {
        alert("❌ Corrige los errores antes de enviar");
        return;
      }

      const token = localStorage.getItem("token");
      if (!token) {
        alert("❌ Debes iniciar sesión primero");
        window.location.href = "login.html";
        return;
      }

      const data = {
        chapeta: ganadoForm.chapeta.value,
        raza: ganadoForm.raza.value,
        edad: ganadoForm.edad.value,
        peso: ganadoForm.peso.value,
        fecha_ingreso: ganadoForm.fecha_ingreso.value,
        estadoICA: ganadoForm.estadoICA.value
      };

      try {
        const response = await fetch("http://localhost:8000/ganado", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify(data)
        });

        if (response.ok) {
          alert("✅ Ganado registrado con éxito");
          ganadoForm.reset();
        } else {
          const error = await response.json();
          alert("❌ Error al registrar: " + (error.error || "Intenta nuevamente"));
        }
      } catch (error) {
        alert("❌ Error en la conexión con el servidor");
      }
    });
  </script>
</body>
</html>
